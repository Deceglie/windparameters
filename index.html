<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Point Drainage Forecast (RRFS Hourly)</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1.5rem;
            background-color: #f8f9fa;
            color: #333;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .header-section {
            margin-bottom: 1.25rem;
        }
        h2 {
            margin: 0 0 0.4rem 0;
            font-size: 1.6rem;
            color: #1a1a1a;
        }
        .subtitle {
            margin: 0;
            color: #64748b;
            font-size: 0.95rem;
        }

        /* Model Update Card */
        .model-updates-container {
            margin-bottom: 1.5rem;
        }
        .model-card {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .model-card-left {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }
        .model-name {
            font-weight: 700;
            font-size: 1rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .model-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #0284c7;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.25);
            display: inline-block;
        }
        .model-cycle-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            background-color: #dbeafe;
            color: #1e40af;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .model-time-info {
            font-size: 0.9rem;
            color: #334155;
        }
        .model-time-info strong {
            color: #0f172a;
        }
        .relative-time {
            color: #64748b;
            font-size: 0.85rem;
            margin-left: 0.25rem;
        }

        /* Location Grid */
        .locations-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 1.5rem;
        }
        .location-section {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 1.25rem;
            border-radius: 8px;
        }
        .location-section h3 {
            margin-top: 0;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #0f172a;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        .input-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
            color: #475569;
        }
        input {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            background: #fff;
        }
        input:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.15);
        }

        /* Action Button */
        button.primary-btn {
            width: 100%;
            padding: 0.875rem;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 1.5rem;
        }
        button.primary-btn:hover {
            background-color: #0052a3;
        }

        #result {
            border-radius: 8px;
            background-color: #fff;
            border: 1px solid #e2e8f0;
            display: none;
            overflow: hidden;
            margin-top: 1.5rem;
        }
        .active-model-banner {
            background: #f1f5f9;
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.9rem;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .active-model-banner strong {
            color: #0f172a;
        }
        #plots {
            width: 100%;
            margin-bottom: 2rem;
        }
        .table-container {
            max-height: 600px;
            overflow-y: auto;
            overflow-x: auto;
        }
        .loader {
            display: inline-block;
            font-style: italic;
            color: #666;
            padding: 1.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: center;
        }
        th, td {
            padding: 8px 10px;
            border: 1px solid #dee2e6;
            white-space: nowrap;
        }
        th {
            position: sticky;
            background-color: #eef2f5;
            font-weight: 600;
            z-index: 2;
        }
        thead tr:nth-child(1) th {
            top: 0;
        }
        thead tr:nth-child(2) th {
            top: 36px;
        }
        td {
            background-color: #fff;
        }
        tr:nth-child(even) td {
            background-color: #f8fafc;
        }
        .time-col {
            font-weight: 600;
            text-align: left;
            background-color: #f1f5f9;
        }
        .error {
            padding: 1.25rem;
            color: #dc2626;
            background-color: #fef2f2;
        }
        .nws-badge {
            font-size: 0.75rem;
            background: #dbeafe;
            color: #1e3a8a;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 4px;
        }
        .rrfs-badge {
            font-size: 0.75rem;
            background: #fef3c7;
            color: #92400e;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 4px;
        }

        /* Sunrise Zoom Controls */
        .zoom-toolbar {
            margin: 1.25rem 0 0.75rem 0;
            padding: 0.85rem 1.15rem;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .zoom-toolbar-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .zoom-toolbar-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .zoom-toolbar-sub {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: normal;
        }
        .zoom-buttons-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .sunrise-zoom-btn {
            padding: 0.45rem 0.85rem;
            background-color: #ffffff;
            color: #334155;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .sunrise-zoom-btn:hover {
            background-color: #f1f5f9;
            border-color: #94a3b8;
            color: #0f172a;
        }
        .sunrise-zoom-btn.active {
            background-color: #0066cc;
            color: #ffffff;
            border-color: #0052a3;
            font-weight: 600;
            box-shadow: 0 1px 3px rgba(0, 102, 204, 0.3);
        }
        .sunrise-zoom-btn .sr-icon {
            font-size: 0.95rem;
            line-height: 1;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .nav-tab {
            padding: 0.75rem 1.35rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 1rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: -2px;
            border-radius: 6px 6px 0 0;
        }
        .nav-tab:hover {
            color: #0066cc;
            background-color: #f1f5f9;
        }
        .nav-tab.active {
            color: #0066cc;
            border-bottom-color: #0066cc;
            background-color: #eff6ff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .plot-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 900px) {
            .locations-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .model-card {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-section">
            <h2>Multi-Point Drainage Forecast (RRFS Hourly)</h2>
            <p class="subtitle">NOAA Rapid Refresh Forecast System (RRFS) Hourly Model via Open-Meteo &amp; NWS Grid Data</p>
        </div>

        <!-- Model Update Information -->
        <div class="model-updates-container">
            <div class="model-card" id="modelCard">
                <div class="model-card-left">
                    <span class="model-dot"></span>
                    <span class="model-name">NOAA RRFS Hourly</span>
                    <span class="model-cycle-tag" id="modelCycle">Loading...</span>
                </div>
                <div class="model-time-info" id="modelUpdateTime">Fetching model update time...</div>
            </div>
        </div>
        
        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button type="button" class="nav-tab active" id="tab-btn-hourly" onclick="switchTab('hourly')">
                <span>📊</span> Hourly Drainage Forecast
            </button>
            <button type="button" class="nav-tab" id="tab-btn-15min" onclick="switchTab('15min')">
                <span>⚡</span> RRFS 15-Minute (18h)
            </button>
        </div>

        <!-- Tab 1: Hourly Forecast -->
        <div class="tab-content active" id="tab-content-hourly">
            <!-- Locations Inputs -->
            <div class="locations-grid">
                <div class="location-section">
                    <h3>Location 1 (Upper)</h3>
                    <div class="input-group">
                        <label for="lat1">Latitude (Echo Lake)</label>
                        <input type="number" id="lat1" step="0.0001" value="39.6596">
                    </div>
                    <div class="input-group">
                        <label for="lon1">Longitude (Echo Lake)</label>
                        <input type="number" id="lon1" step="0.0001" value="-105.5979">
                    </div>
                </div>
                
                <div class="location-section">
                    <h3>Location 2 (Lower)</h3>
                    <div class="input-group">
                        <label for="lat2">Latitude (Morrison)</label>
                        <input type="number" id="lat2" step="0.0001" value="39.6536" onchange="syncLocation2(this.value, 'lat')">
                    </div>
                    <div class="input-group">
                        <label for="lon2">Longitude (Morrison)</label>
                        <input type="number" id="lon2" step="0.0001" value="-105.1911" onchange="syncLocation2(this.value, 'lon')">
                    </div>
                </div>
            </div>
            
            <button id="refreshBtn" class="primary-btn" onclick="fetchData()">Refresh forecast</button>

            <div id="result"></div>
        </div>

        <!-- Tab 2: 15-Minute RRFS (Lower Location Only) -->
        <div class="tab-content" id="tab-content-15min">
            <div class="location-section" style="margin-bottom: 1.5rem;">
                <h3>Lower Location (Morrison)</h3>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div class="input-group" style="flex: 1; min-width: 200px;">
                        <label for="lat2_15m">Latitude</label>
                        <input type="number" id="lat2_15m" step="0.0001" value="39.6536" onchange="syncLocation2(this.value, 'lat')">
                    </div>
                    <div class="input-group" style="flex: 1; min-width: 200px;">
                        <label for="lon2_15m">Longitude</label>
                        <input type="number" id="lon2_15m" step="0.0001" value="-105.1911" onchange="syncLocation2(this.value, 'lon')">
                    </div>
                </div>
            </div>

            <button id="refresh15mBtn" class="primary-btn" onclick="fetch15MinData()">Refresh 15-Minute Forecast</button>

            <div id="result-15min" style="display: none; margin-top: 1.5rem;"></div>
        </div>
    </div>

    <script>
        let cachedMetadata = null;
        let currentPlotData = null;
        let currentFullRange = null;
        let currentSunriseWindows = [];
        let hasLoaded15Min = false;

        function syncLocation2(val, type) {
            if (type === 'lat') {
                const el1 = document.getElementById('lat2');
                const el2 = document.getElementById('lat2_15m');
                if (el1) el1.value = val;
                if (el2) el2.value = val;
            } else if (type === 'lon') {
                const el1 = document.getElementById('lon2');
                const el2 = document.getElementById('lon2_15m');
                if (el1) el1.value = val;
                if (el2) el2.value = val;
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            const btn = document.getElementById(`tab-btn-${tabName}`);
            const content = document.getElementById(`tab-content-${tabName}`);
            if (btn) btn.classList.add('active');
            if (content) content.classList.add('active');

            if (tabName === 'hourly') {
                const p = document.getElementById('plots');
                if (p && p.data) Plotly.Plots.resize('plots');
            } else if (tabName === '15min') {
                const ps = document.getElementById('plot-15m-speed');
                const pg = document.getElementById('plot-15m-gust');
                if (ps && ps.data) Plotly.Plots.resize('plot-15m-speed');
                if (pg && pg.data) Plotly.Plots.resize('plot-15m-gust');

                if (!hasLoaded15Min) {
                    fetch15MinData();
                }
            }
        }

        function getPointsInWindow(arr1, arr2, windowStart, windowEnd) {
            const vals = [];
            if (!currentPlotData || !currentPlotData.times) return vals;
            const tStart = windowStart.getTime();
            const tEnd = windowEnd.getTime();

            for (let i = 0; i < currentPlotData.times.length; i++) {
                const t = currentPlotData.times[i].getTime();
                // Include data points within the window or within 45 minutes of boundaries
                // so lines crossing the visible edge are included in vertical scaling
                if (t >= tStart - 2700000 && t <= tEnd + 2700000) {
                    if (arr1 && arr1[i] !== null && arr1[i] !== undefined && !isNaN(arr1[i])) vals.push(arr1[i]);
                    if (arr2 && arr2[i] !== null && arr2[i] !== undefined && !isNaN(arr2[i])) vals.push(arr2[i]);
                }
            }
            return vals;
        }

        function getPBLHRange(vals) {
            if (!vals || vals.length === 0) return null;
            const min = Math.min(...vals);
            const max = Math.max(...vals);
            const span = max - min;
            const pad = Math.max(25, span * 0.15);
            const rangeMin = Math.max(0, Math.floor(min - pad));
            let rangeMax = Math.ceil(max + pad);
            if (rangeMax <= rangeMin + 50) rangeMax = rangeMin + 100;
            return [rangeMin, rangeMax];
        }

        function getSkyRange(vals) {
            if (!vals || vals.length === 0) return [0, 100];
            const min = Math.min(...vals);
            const max = Math.max(...vals);
            if (min === 0 && max === 0) return [0, 20];
            let rangeMin = Math.max(0, Math.floor((min - 5) / 5) * 5);
            let rangeMax = Math.min(100, Math.ceil((max + 5) / 5) * 5);
            if (rangeMax - rangeMin < 20) {
                rangeMax = Math.min(100, rangeMin + 20);
                rangeMin = Math.max(0, rangeMax - 20);
            }
            return [rangeMin, rangeMax];
        }

        function getTempRange(vals) {
            if (!vals || vals.length === 0) return null;
            const min = Math.min(...vals);
            const max = Math.max(...vals);
            const span = max - min;
            const pad = Math.max(2, Math.ceil(span * 0.15));
            let rangeMin = Math.floor(min - pad);
            let rangeMax = Math.ceil(max + pad);
            if (rangeMax - rangeMin < 6) {
                rangeMin -= 2;
                rangeMax += 2;
            }
            return [rangeMin, rangeMax];
        }

        function getWindRange(vals) {
            if (!vals || vals.length === 0) return [0, 15];
            const min = Math.min(...vals);
            const max = Math.max(...vals);
            const span = max - min;
            const pad = Math.max(1.5, span * 0.2);
            let rangeMin = (min <= 4) ? 0 : Math.max(0, Math.floor(min - pad));
            let rangeMax = Math.ceil(max + pad);
            if (rangeMax <= rangeMin + 3) rangeMax = rangeMin + 5;
            return [rangeMin, rangeMax];
        }

        function zoomToSunrise(target) {
            if (!currentPlotData || !currentFullRange) return;

            document.querySelectorAll('.sunrise-zoom-btn').forEach(b => b.classList.remove('active'));

            const plotElem = document.getElementById('plots');
            if (!plotElem || !plotElem.data) return;

            if (target === 'all') {
                const btnAll = document.getElementById('btn-zoom-all');
                if (btnAll) btnAll.classList.add('active');

                Plotly.relayout('plots', {
                    'xaxis.range': [currentFullRange.start, currentFullRange.end],
                    'yaxis.autorange': true,
                    'yaxis2.autorange': true,
                    'yaxis3.autorange': true,
                    'yaxis4.autorange': true
                });
                return;
            }

            const sw = currentSunriseWindows[target];
            if (!sw) return;

            const btn = document.getElementById(`btn-zoom-${target}`);
            if (btn) btn.classList.add('active');

            const pblhVals = getPointsInWindow(currentPlotData.pblh1, currentPlotData.pblh2, sw.windowStart, sw.windowEnd);
            const skyVals = getPointsInWindow(currentPlotData.sky1, currentPlotData.sky2, sw.windowStart, sw.windowEnd);
            const tempVals = getPointsInWindow(currentPlotData.temp1, currentPlotData.temp2, sw.windowStart, sw.windowEnd);
            const wsVals = getPointsInWindow(currentPlotData.ws1, currentPlotData.ws2, sw.windowStart, sw.windowEnd);

            const updateObj = {
                'xaxis.range': [sw.windowStart, sw.windowEnd]
            };

            const pblhR = getPBLHRange(pblhVals);
            if (pblhR) {
                updateObj['yaxis.range'] = pblhR;
                updateObj['yaxis.autorange'] = false;
            } else {
                updateObj['yaxis.autorange'] = true;
            }

            const skyR = getSkyRange(skyVals);
            if (skyR) {
                updateObj['yaxis2.range'] = skyR;
                updateObj['yaxis2.autorange'] = false;
            } else {
                updateObj['yaxis2.autorange'] = true;
            }

            const tempR = getTempRange(tempVals);
            if (tempR) {
                updateObj['yaxis3.range'] = tempR;
                updateObj['yaxis3.autorange'] = false;
            } else {
                updateObj['yaxis3.autorange'] = true;
            }

            const wsR = getWindRange(wsVals);
            if (wsR) {
                updateObj['yaxis4.range'] = wsR;
                updateObj['yaxis4.autorange'] = false;
            } else {
                updateObj['yaxis4.autorange'] = true;
            }

            Plotly.relayout('plots', updateObj);
        }

        function getWindDir(degrees) {
            if (degrees === null || degrees === undefined || isNaN(degrees)) return '--';
            const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            return dirs[Math.round(degrees / 22.5) % 16];
        }

        // Flow vector convention: arrow points in the direction the wind is blowing towards
        function formatWindDir(degrees) {
            if (degrees === null || degrees === undefined || isNaN(degrees)) return '';
            const deg = (Number(degrees) % 360 + 360) % 360;
            const targetArrows = ['↑', '↗', '→', '↘', '↓', '↙', '←', '↖'];
            return targetArrows[Math.round(((deg + 180) % 360) / 45) % 8];
        }

        function formatWindDirFull(degrees) {
            if (degrees === null || degrees === undefined || isNaN(degrees)) return '--';
            const deg = Math.round((Number(degrees) % 360 + 360) % 360);
            const card = getWindDir(degrees);
            const arrow = formatWindDir(degrees);
            return arrow ? `${arrow} ${card} (${deg}°)` : `${card} (${deg}°)`;
        }

        function formatLocalDateTime(date) {
            if (!date || isNaN(date.getTime())) return 'Unavailable';
            return date.toLocaleString('en-US', {
                timeZone: 'America/Denver',
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true,
                timeZoneName: 'short'
            });
        }

        function formatRelativeTime(date) {
            if (!date || isNaN(date.getTime())) return '';
            const diffMs = Date.now() - date.getTime();
            if (diffMs < 0) return '';
            const mins = Math.floor(diffMs / 60000);
            if (mins < 60) return `(${mins}m ago)`;
            const hours = Math.floor(mins / 60);
            const remMins = mins % 60;
            return `(${hours}h ${remMins}m ago)`;
        }

        function getUtcRun(date) {
            if (!date || isNaN(date.getTime())) return '--';
            const h = String(date.getUTCHours()).padStart(2, '0');
            return `${h}z Run`;
        }

        // Fetch model metadata for RRFS update time
        async function fetchModelMetadata() {
            const metaUrl = `https://api.open-meteo.com/data/ncep_rrfs_conus/static/meta.json?_=${Date.now()}`;
            try {
                const res = await fetch(metaUrl, { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    cachedMetadata = {
                        initTime: data.last_run_initialisation_time ? new Date(data.last_run_initialisation_time * 1000) : null,
                        modTime: (data.last_run_modification_time || data.last_run_availability_time) ? new Date((data.last_run_modification_time || data.last_run_availability_time) * 1000) : null
                    };
                    updateMetadataUI();
                }
            } catch (err) {
                console.warn('Metadata fetch error:', err);
                const timeEl = document.getElementById('modelUpdateTime');
                if (timeEl && !cachedMetadata) timeEl.textContent = 'Update time check unavailable';
            }
        }

        function updateMetadataUI() {
            if (!cachedMetadata) return;
            const cycleEl = document.getElementById('modelCycle');
            const timeEl = document.getElementById('modelUpdateTime');

            if (cycleEl) {
                cycleEl.textContent = getUtcRun(cachedMetadata.initTime);
            }
            if (timeEl) {
                if (cachedMetadata.modTime) {

                } else {

            }

        // Helper to query NWS Grid Data
        async function getNWSData(lat, lon) {
            try {
                const ptRes = await fetch(`https://api.weather.gov/points/${lat},${lon}`);
                if (!ptRes.ok) return null;
                const ptData = await ptRes.json();
                
                const gridUrl = ptData.properties.forecastGridData;
                const gridRes = await fetch(gridUrl);
                if (!gridRes.ok) return null;
                const gridData = await gridRes.json();
                
                return gridData.properties;
            } catch (err) {
                console.error("NWS Fetch Error:", err);
                return null;
            }
        }

        // Helper to match an exact target time against NWS duration blocks
        function getNWSValueForTime(nwsProperty, targetTimeStr) {
            if (!nwsProperty || !nwsProperty.values) return null;
            
            const targetTime = new Date(targetTimeStr.endsWith('Z') ? targetTimeStr : targetTimeStr + 'Z').getTime();

            for (let item of nwsProperty.values) {
                const parts = item.validTime.split('/');
                const startTimeStr = parts[0];
                const durationStr = parts[1];
                
                const start = new Date(startTimeStr).getTime();
                let end = start + 3600000; // default 1 hour window
                
                if (durationStr) {
                    let days = 0, hours = 0;
                    const dMatch = durationStr.match(/(\d+)D/);
                    if (dMatch) days = parseInt(dMatch[1]);
                    const hMatch = durationStr.match(/(\d+)H/);
                    if (hMatch) hours = parseInt(hMatch[1]);
                    end = start + (days * 24 + hours) * 3600000;
                }

                if (targetTime >= start && targetTime < end) {
                    return item.value;
                }
            }
            return null;
        }

                resDiv.innerHTML = `<div class='error'>Error fetching 15-minute data: ${e.message}</div>`;
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = 'Refresh 15-Minute Forecast';
                }
            }
        }

        // Initialize metadata on load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', fetchModelMetadata);
        } else {
            fetchModelMetadata();
        }

        // Periodically refresh relative time display every minute
        setInterval(updateMetadataUI, 60000);
    </script>
</body>
</html>
